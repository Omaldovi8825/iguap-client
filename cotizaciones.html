<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Expedientes</title>
    <link
      rel="icon"
      href="./assets/images/iguapp-logo-v3.svg"
      type="image/svg+xml"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>

  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="initialLoad"></loader-iguana>
      <template v-else>
        <header-back heading="Cotizaciones"></header-back>
        <div class="container pt-3">
          <div class="row">
            <div class="col-12 col-md-4 mb-3">
              <form @submit.prevent="createExpediente">
                <div class="input-group has-validation mb-3">
                  <input
                    type="text"
                    class="form-control"
                    :class="{ 'is-invalid': form.nombre.error }"
                    placeholder="ej: Sr Juan"
                    v-model="form.nombre.value"
                  />
                  <button
                    class="btn btn-iguapp"
                    type="submit"
                    :disabled="isLoading"
                  >
                    <span
                      v-if="isLoading"
                      class="spinner-border spinner-border-sm"
                      role="status"
                      aria-hidden="true"
                    ></span>
                    <span v-else>
                      <i class="bi bi-folder-plus"></i>
                    </span>
                  </button>
                  <div class="invalid-feedback">{{ form.nombre.error }}</div>
                </div>
              </form>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  type="text"
                  class="form-control"
                  placeholder="Buscar expediente..."
                  v-model="search"
                />
              </div>
            </div>
            <div class="col mb-3">
              <div v-if="isLoading" class="d-flex justify-content-center">
                <spinner size="2rem"></spinner>
              </div>
              <div v-else class="row">
                <div
                  class="col-6 col-md-4 mb-3"
                  v-for="expediente in filteredExpedientes"
                  :key="expediente._id"
                >
                  <card-folder
                    :expediente="expediente"
                    :url="`./expediente.html?id=${expediente._id}`"
                    @guardar-expediente="guardarEdicion"
                    @eliminar-expediente="eliminarExpediente"
                  ></card-folder>
                </div>
              </div>
            </div>
          </div>
        </div>
        <a
          href="./cotizacion.html"
          class="btn btn-iguapp rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center p-0"
          style="width: 3.5rem; height: 3.5rem"
          aria-label="Nueva cotización"
        >
          <i class="bi bi-coin fs-4"></i>
        </a>
      </template>
    </div>

    <script src="./js/expedientes.js" type="module"></script>
  </body>
</html>
