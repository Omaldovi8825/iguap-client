<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>

  <body>
    <div id="app" v-cloak class="container">
      <header-back heading="Expedientes"></header-back>
      <div class="row">
        <div class="col-12 col-md-4 mb-3">
          <form @submit.prevent="createExpediente">
            <div class="input-group has-validation mb-3">
              <input
                type="text"
                class="form-control"
                :class="{ 'is-invalid': form.nombre.error }"
                placeholder="ej: Sr Juan"
                v-model="form.nombre.value"
              />
              <button
                class="btn btn-outline-primary"
                type="submit"
                :disabled="isLoading"
              >
                <span
                  v-if="isLoading"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                <span v-else>Crear</span>
              </button>
              <div class="invalid-feedback">{{ form.nombre.error }}</div>
            </div>
          </form>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="search"
              class="form-control"
              placeholder="Buscar expediente..."
              v-model="search"
            />
          </div>
        </div>
        <div class="col mb-3">
          <div class="row">
            <div
              class="col-6 col-md-4 mb-3"
              v-for="expediente in filteredExpedientes"
              :key="expediente._id"
            >
              <div class="border rounded p-1">
                <div class="d-flex justify-content-between">
                  <div
                    v-if="folderToEdit.id === expediente._id"
                    class="border rounded"
                  >
                    <button
                      type="button"
                      class="btn btn-sm"
                      @click.stop="cancelarEdicion"
                    >
                      <i class="bi bi-x-circle text-danger fs-6"></i>
                    </button>
                    <button
                      type="button"
                      class="btn btn-sm"
                      @click.stop="guardarEdicion"
                    >
                      <i class="bi bi-check-circle text-success fs-6"></i>
                    </button>
                  </div>
                  <button
                    v-else
                    type="button"
                    class="btn btn-sm"
                    @click.stop="modoEdicion(expediente._id)"
                  >
                    <i class="bi bi-pencil text-primary fs-6"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm"
                    @click.stop="eliminarExpediente(expediente._id)"
                  >
                    <i class="bi bi-trash text-danger fs-6"></i>
                  </button>
                </div>
                <div class="text-center position-relative mb-2">
                  <i class="bi bi-folder-fill display-4 text-warning"></i>
                  <a
                    :href="`./expediente.html?id=${expediente._id}`"
                    class="stretched-link"
                  ></a>
                </div>
                <div class="text-center mb-3">
                  <input
                    v-if="folderToEdit.id === expediente._id"
                    type="text"
                    class="form-control form-control-sm text-center"
                    v-model="folderToEdit.nombre"
                  />
                  <span v-else class="text-truncate"
                    >{{ expediente.nombre }}</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/expedientes.js" type="module"></script>
  </body>
</html>
