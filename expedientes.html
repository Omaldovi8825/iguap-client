<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>

  <body>
    <div id="app" v-cloak class="container">
      <header-back heading="Expedientes"></header-back>
      <div class="row">
        <div class="col-12 col-md-4 mb-3">
          <form @submit.prevent="createExpediente">
            <div class="input-group has-validation">
              <input
                type="text"
                class="form-control"
                :class="{ 'is-invalid': form.nombre.error }"
                placeholder="ej: Sr Juan"
                v-model="form.nombre.value"
              />
              <button
                class="btn btn-outline-primary"
                type="submit"
                :disabled="isLoading"
              >
                <span
                  v-if="isLoading"
                  class="spinner-border spinner-border-sm"
                  role="status"
                  aria-hidden="true"
                ></span>
                <span v-else>Crear</span>
              </button>
              <div class="invalid-feedback">{{ form.nombre.error }}</div>
            </div>
          </form>
        </div>
        <div class="col mb-3">
          <div class="row">
            <div
              class="col-6 col-md-4"
              v-for="expediente in expedientes"
              :key="expediente._id"
            >
              <a
                :href="`./expediente.html?id=${expediente._id}`"
                class="card text-decoration-none text-body h-100"
              >
                <div class="card-body text-center">
                  <i class="bi bi-folder-fill display-4 text-warning"></i>
                  <div
                    class="small text-truncate mt-2"
                    :title="expediente.nombre"
                  >
                    {{ expediente.nombre }}
                  </div>
                  <!-- <div class="mt-2">
                  <button type="button" class="btn btn-sm btn-outline-primary">
                    <i class="bi bi-pencil"></i>
                  </button>
                  <button
                    type="button"
                    class="btn btn-sm btn-outline-danger ms-1"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </div> -->
                </div>
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/expedientes.js" type="module"></script>
  </body>
</html>
