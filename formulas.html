<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Fórmulas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="isLoading"></loader-iguana>
      <template v-else>
        <header-back heading="Fórmulas"></header-back>
        <div class="container pt-3">
          <div class="row">
            <div class="col-12 col-md-4 mb-3">
              <form @submit.prevent="createFolder">
                <div class="input-group has-validation mb-3">
                  <input
                    type="text"
                    class="form-control"
                    :class="{ 'is-invalid': form.nombre.error }"
                    placeholder="ej: V/C 2'"
                    v-model="form.nombre.value"
                  />
                  <button
                    class="btn btn-iguapp"
                    type="submit"
                    :disabled="isLoading"
                  >
                    <span
                      v-if="isLoading"
                      class="spinner-border spinner-border-sm"
                      role="status"
                      aria-hidden="true"
                    ></span>
                    <span v-else>
                      <i class="bi bi-folder-plus"></i>
                    </span>
                  </button>
                  <div class="invalid-feedback">{{ form.nombre.error }}</div>
                </div>
              </form>
              <div class="mb-3">
                <a href="./formula.html" class="btn btn-iguapp w-100">
                  <span>Nueva fórmula</span>
                </a>
              </div>
              <div class="input-group">
                <span class="input-group-text">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  type="search"
                  class="form-control"
                  placeholder="Buscar..."
                  v-model="search"
                />
              </div>
            </div>
            <div class="col mb-3">
              <div v-if="!!filteredFoldersFormulas.length" class="row">
                <div class="col-12">
                  <h2 class="fs-4 color_iguapp_green">Folders</h2>
                </div>
                <div
                  v-for="folder in filteredFoldersFormulas"
                  :key="folder._id"
                  class="col-6 col-md-4 col-lg-3 mb-3"
                >
                  <a
                    :href="`./folder-formula.html?id_folder=${folder._id}`"
                    class="border rounded-3 p-3 d-flex flex-column align-items-center text-decoration-none text-dark bg-light-subtle"
                  >
                    <i
                      class="bi bi-folder-fill display-4 text-warning mb-2"
                    ></i>
                    <span>{{ folder.nombre }}</span>
                  </a>
                </div>
              </div>
              <div v-if="!!filteredFormulasSingle.length" class="row">
                <div class="col-12">
                  <h2 class="fs-4 color_iguapp_green">Fórmulas</h2>
                </div>
                <div
                  v-for="formula in filteredFormulasSingle"
                  :key="formula._id"
                  class="col-6 col-md-4 col-lg-3 mb-3"
                >
                  <a
                    :href="`./formula.html?id=${formula._id}`"
                    class="border rounded-3 p-3 d-flex flex-column align-items-center text-decoration-none text-dark bg-light-subtle"
                  >
                    <i
                      class="bi bi-calculator display-4 mb-2 color_iguapp_green"
                    ></i>
                    <span>{{ formula.nombre }}</span>
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>

    <script src="./js/formulas.js" type="module"></script>
  </body>
</html>
