<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Login</title>
    <link
      rel="icon"
      href="./assets/images/iguapp-logo-v3.svg"
      type="image/svg+xml"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->

    <style>
      .input-password {
        width: 3.25rem;
        height: 4rem;
        border-radius: 0.75rem;
        border: 2px solid transparent;
        outline: none;
        background: #f7fbf5;
        color: #123f17;
        font-family: Fredoka, sans-serif;
        font-size: 1.75rem;
        text-align: center;
        caret-color: #2f8a2c;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.18);
        -moz-appearance: textfield;
      }

      .input-password::-webkit-outer-spin-button,
      .input-password::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      .input-password:focus {
        border-color: #aef326;
        box-shadow: 0 0 0 4px rgba(174, 243, 38, 0.25);
      }
    </style>
  </head>

  <body>
    <div id="app" v-cloak>
      <div class="container">
        <div class="row">
          <div class="col"></div>
          <div
            class="col-12 col-md-6 col-lg-4 vh-100 d-flex flex-column justify-content-between bg_iguapp_dark_green py-3"
          >
            <div class="d-flex justify-content-between align-items-center px-3">
              <h1
                class="mb-0 color_iguapp_light_green"
                style="font-family: Fredoka, sans-serif; letter-spacing: 0.1em"
              >
                Iguapp
              </h1>
              <img
                src="./assets/images/iguapp-circle.svg"
                alt="iguapp"
                class="img-fluid"
                width="50px"
              />
            </div>
            <div>
              <span
                class="text-white text-center d-block mb-4"
                style="letter-spacing: 0.35em"
                >PIN</span
              >
              <div class="d-flex justify-content-center gap-3">
                <input
                  ref="inputOneEl"
                  type="number"
                  inputmode="numeric"
                  maxlength="1"
                  autocomplete="off"
                  class="input-password"
                  v-model="inputOne"
                />
                <input
                  ref="inputTwoEl"
                  type="number"
                  inputmode="numeric"
                  maxlength="1"
                  autocomplete="off"
                  class="input-password"
                  v-model="inputTwo"
                />
                <input
                  ref="inputThreeEl"
                  type="number"
                  inputmode="numeric"
                  maxlength="1"
                  autocomplete="off"
                  class="input-password"
                  v-model="inputThree"
                />
                <input
                  ref="inputFourEl"
                  type="number"
                  inputmode="numeric"
                  maxlength="1"
                  autocomplete="off"
                  class="input-password"
                  v-model="inputFour"
                />
              </div>
            </div>
            <div></div>
          </div>
          <div class="col"></div>
        </div>
      </div>
    </div>

    <script src="./js/login.js" type="module"></script>
  </body>
</html>
