<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app" class="container">
      <h1 class="text-center">Cotización</h1>
      <div class="row">
        <div class="col"></div>
        <div class="col-12 col-md-8 border">
          <form class="border p-3">
            <div
              v-for="(pieza, iPieza) in cotizacion.piezas"
              :key="iPieza"
              class="row"
            >
              <div class="col-12 mb-3">
                <label class="form-label">Pieza</label>
                <select
                  v-model="cotizacion.piezas[iPieza].pieza"
                  class="form-select form-select-sm"
                >
                  <option value="ventana">Ventana</option>
                </select>
              </div>
              <template v-if="pieza.pieza === 'ventana'">
                <div class="col-6 mb-3">
                  <label class="form-label">Ancho (cm)</label>
                  <input
                    type="number"
                    step="0.01"
                    v-model="cotizacion.piezas[iPieza].medidas.ancho"
                    class="form-control form-control-sm"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Alto (cm)</label>
                  <input
                    type="number"
                    step="0.01"
                    v-model="cotizacion.piezas[iPieza].medidas.alto"
                    class="form-control form-control-sm"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Medida Perfiles (in)</label>
                  <select
                    v-model="cotizacion.piezas[iPieza].perfiles.medida"
                    class="form-control form-control-sm"
                  >
                    <option
                      v-for="medida in optionsDisponibles.ventana.perfil.medidas"
                      :key="medida"
                      :value="medida"
                    >
                      {{ medida }}
                    </option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Color Perfiles</label>
                  <select
                    v-model="cotizacion.piezas[iPieza].perfiles.color"
                    class="form-control form-control-sm"
                  >
                    <option
                      v-for="color in coloresPerfilDisponibles(iPieza)"
                      :key="color"
                      :value="color"
                    >
                      {{ color }}
                    </option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Medida vidrio (mm)</label>
                  <select
                    v-model="cotizacion.piezas[iPieza].vidrio.medida"
                    class="form-control form-control-sm"
                  >
                    <option
                      v-for="medida in optionsDisponibles.ventana.vidrio.medidas"
                      :key="medida"
                      :value="medida"
                    >
                      {{ medida }}
                    </option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Vidrio</label>
                  <select
                    v-model="cotizacion.piezas[iPieza].vidrio.id"
                    class="form-control form-control-sm"
                  >
                    <option
                      v-for="vidrio in vidrioDisponibles(iPieza)"
                      :key="vidrio.id"
                      :value="vidrio.id"
                    >
                      {{ vidrio.material }}
                    </option>
                  </select>
                </div>
              </template>
            </div>
          </form>
        </div>
        <div class="col"></div>
      </div>
    </div>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
