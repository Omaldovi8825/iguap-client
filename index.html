<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak class="container">
      <div class="row">
        <div class="col"></div>
        <div class="col-12 col-md-6">
          <h1 class="text-center fs-2">Iguapp</h1>
          <new-formula></new-formula>
          <new-cotizacion></new-cotizacion>
          <div v-if="isLoading" class="text-center my-3">
            <div class="spinner-border text-secondary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
          </div>
          <table v-else class="table">
            <thead>
              <tr>
                <th colspan="2">Fórmulas guardadas</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="formula in formulasDb" :key="formula.id">
                <td>{{ formula.nombre }}</td>
                <td class="text-end">
                  <a
                    :href="`./cotizacion.html?id=${formula._id}`"
                    class="btn btn-outline-success btn-sm"
                  >
                    <i class="bi bi-coin"></i>
                  </a>
                  <a
                    :href="`./formula.html?id=${formula._id}`"
                    class="btn btn-outline-primary btn-sm ms-2"
                  >
                    <i class="bi bi-pencil"></i>
                  </a>
                  <button
                    @click="eliminarFormula(formula._id)"
                    class="btn btn-outline-danger btn-sm ms-2"
                  >
                    <i class="bi bi-trash"></i>
                  </button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
        <div class="col"></div>
      </div>
    </div>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
