<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Home</title>
    <link
      rel="icon"
      href="./assets/images/iguapp-logo-v3.svg"
      type="image/svg+xml"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin /> -->
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600&display=swap"
      rel="stylesheet"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>

  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="isLoading"></loader-iguana>
      <template v-else>
        <div
          class="d-flex justify-content-between align-items-center p-3 bg_iguapp_dark_green"
        >
          <h1
            class="mb-0 color_iguapp_light_green"
            style="font-family: Fredoka, sans-serif; letter-spacing: 0.1em"
          >
            Iguapp
          </h1>
          <img
            src="./assets/images/iguapp-circle.svg"
            alt="iguapp"
            class="img-fluid"
            width="50px"
          />
        </div>
        <div class="container pt-3">
          <div class="row">
            <div class="col"></div>
            <div class="col-12 col-md-6">
              <div class="mb-3">
                <a
                  href="./formulas.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-calculator fs-1"></i>
                  Fórmulas
                </a>
              </div>
              <div class="mb-3">
                <a
                  href="./cotizaciones.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-file-earmark-post fs-1"></i>
                  Cotizaciones
                </a>
              </div>
              <div class="mb-3">
                <a
                  href="./materiales.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-tools fs-1"></i>
                  Materiales
                </a>
              </div>
            </div>
            <div class="col"></div>
          </div>
        </div>
      </template>
    </div>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
