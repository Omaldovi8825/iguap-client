<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Home</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>

  <body>
    <div id="app" v-cloak>
      <div
        v-if="isLoading"
        class="d-flex align-items-center justify-content-center min-vh-100"
      >
        <img
          class="logo-loader"
          src="./assets/images/iguapp-logo-v3.svg"
          alt="Loading..."
          width="160"
        />
      </div>
      <div v-else>
        <img
          src="./assets/images/iguapp-header.svg"
          alt="iguapp"
          class="img-fluid"
        />
        <div class="container">
          <div class="row">
            <div class="col"></div>
            <div class="col-12 col-md-6 pt-3">
              <div class="mb-3">
                <a
                  href="./formulas.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-calculator fs-1"></i>
                  Fórmulas
                </a>
              </div>
              <!-- <div class="mb-3">
                <a
                  href="./expedientes.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-file-earmark-post fs-1"></i>
                  Expedientes
                </a>
              </div> -->
              <div class="mb-3">
                <a
                  href="./materiales.html"
                  class="btn btn-iguapp w-100 d-flex flex-column"
                >
                  <i class="bi bi-tools fs-1"></i>
                  Materiales
                </a>
              </div>
            </div>
            <div class="col"></div>
          </div>
        </div>
      </div>
    </div>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
