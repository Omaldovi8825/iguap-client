<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app" class="container">
      <h1 class="text-center">Cotización</h1>
      <div class="row">
        <div class="col-12 col-md-4 border">
          <form
            class="p-3 border"
            @submit.prevent="agregarPieza(formNuevaPieza)"
          >
            <div class="mb-3">
              <label class="form-label">Nueva pieza</label>
              <select v-model="formNuevaPieza" class="form-control">
                <option value="" disabled>Selecciona pieza</option>
                <option
                  v-for="pieza in optionsDisponibles.piezas"
                  :key="pieza"
                  :value="pieza"
                >
                  {{ pieza }}
                </option>
              </select>
            </div>
            <!-- <div v-if="isVentanaSelected" class="mb-3">
              <label class="form-label">Medida perfil (in)</label>
              <select
                v-model="formNuevaPieza.medidaPerfil"
                class="form-control"
              >
                <option value="" disabled>Selecciona medida</option>
                <option
                  v-for="medida in optionsDisponibles.medidasPerfil"
                  :key="medida"
                  :value="medida"
                >
                  {{ medida }}
                </option>
              </select>
            </div> -->
            <button class="btn btn-outline-secondary w-100">Agregar +</button>
          </form>
        </div>
        <div class="col-12 col-md-8 border">
          <section
            v-for="(pieza, iPieza) in cotizacion.piezas"
            :key="`${pieza.pieza}_${iPieza}`"
            class="border"
          >
            <h4 class="mb-0 text-center border">{{ pieza.pieza }}</h4>
            <form>
              <template v-if="pieza.pieza === 'ventana'">
                <section class="border">
                  <h5 class="mb-0 border">Perfiles</h5>
                  <div class="row">
                    <div class="col-4 mb-2"></div>
                    <div class="col-4 mb-2">Pulgadas</div>
                    <div class="col-4 mb-2">Color</div>
                    <div class="col-4 mb-2"></div>
                    <div class="col-4 mb-2">
                      <select
                        @change="cambiarMedidaPerfiles($event, iPieza)"
                        class="form-control form-control-sm"
                      >
                        <option
                          v-for="medida in optionsDisponibles.medidasPerfil"
                          :key="medida"
                          :value="medida"
                        >
                          {{ medida }}
                        </option>
                      </select>
                    </div>
                    <div class="col-4 mb-2">
                      <select
                        @change="cambiarColorPerfiles($event, iPieza)"
                        class="form-control form-control-sm"
                      >
                        <option
                          v-for="color in optionsDisponibles.coloresPerfil"
                          :key="color"
                          :value="color"
                        >
                          {{ color }}
                        </option>
                      </select>
                    </div>
                    <template
                      v-for="(perfil, iPerfil) in pieza.perfiles"
                      :key="perfil.material"
                    >
                      <div class="col-4 mb-2">{{ perfil.material }}</div>
                      <div class="col-4 mb-2">
                        <select
                          v-model="cotizacion.piezas[iPieza].perfiles[iPerfil].medida"
                          class="form-control form-control-sm"
                        >
                          <option
                            v-for="medida in optionsDisponibles.medidasPerfil"
                            :key="medida"
                            :value="medida"
                          >
                            {{ medida }}
                          </option>
                        </select>
                      </div>
                      <div class="col-4 mb-2">
                        <select
                          v-model="cotizacion.piezas[iPieza].perfiles[iPerfil].color"
                          class="form-control form-control-sm"
                        >
                          <option
                            v-for="color in optionsDisponibles.coloresPerfil"
                            :key="color"
                            :value="color"
                          >
                            {{ color }}
                          </option>
                        </select>
                      </div>
                    </template>
                  </div>
                </section>
              </template>
            </form>
          </section>
        </div>
      </div>
    </div>

    <script src="./js/main.js" type="module"></script>
  </body>
</html>
