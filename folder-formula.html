<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Folder de fórmulas</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="isLoading"></loader-iguana>
      <template v-else>
        <header-back :heading="folder.nombre"></header-back>
        <div class="container pt-3">
          <div class="row">
            <div class="col"></div>
            <div class="co-12 col-md-8 mb-3">
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Nombre</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody>
                    <!-- <tr v-for="formula in folder.formulas" :key="formula._id">
                      <td>{{ formula.nombre }}</td>
                    </tr> -->
                  </tbody>
                </table>
              </div>
            </div>
            <div class="col"></div>
          </div>
        </div>
        <a
          :href="`./formula.html?id_folder=${folder._id}`"
          class="btn btn-iguapp rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center p-0"
          style="width: 3.5rem; height: 3.5rem"
          aria-label="Nueva fórmula"
        >
          <i class="bi bi-plus-slash-minus fs-4"></i>
        </a>
      </template>
    </div>

    <script src="./js/folder-formula.js" type="module"></script>
  </body>
</html>
