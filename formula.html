<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="isLoading"></loader-iguana>
      <template v-else>
        <header-back heading="Nueva fórmula"></header-back>
        <div class="container pt-3">
          <div class="row">
            <div class="col"></div>
            <div class="col-12 col-md-8">
              <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input
                  type="text"
                  class="form-control form-control-sm"
                  v-model="formFormula.nombre"
                />
              </div>
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>Material</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
            <div class="col"></div>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-iguapp rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center p-0"
          style="width: 3.5rem; height: 3.5rem"
          aria-label="Nuevo material"
          @click="materialModalOpen = true"
        >
          <i class="bi bi-tools fs-4"></i>
        </button>

        <modal-base
          v-if="materialModalOpen"
          aria-labelledby="materialModalTitle"
          @close="materialModalOpen = false"
        >
          <form
            @submit.prevent="onSubmit"
            class="d-flex flex-column overflow-hidden"
          >
            <header class="modal-header">
              <h2 class="modal-title fs-5" id="materialModalTitle">Tras</h2>
              <button
                type="button"
                class="btn-close"
                aria-label="Cerrar"
                @click="materialModalOpen = false"
              ></button>
            </header>
            <div class="modal-body"></div>
            <footer class="modal-footer">
              <button class="btn btn-iguapp">Agregar +</button>
            </footer>
          </form>
        </modal-base>
      </template>
    </div>

    <script src="./js/formula.js" type="module"></script>
  </body>
</html>
