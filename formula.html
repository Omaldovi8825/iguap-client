<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Fórmula</title>
    <link
      rel="icon"
      href="./assets/images/iguapp-logo-v3.svg"
      type="image/svg+xml"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="firstLoad"></loader-iguana>
      <template v-else>
        <header-back :heading="heading"></header-back>
        <div class="container pt-3 mb-5">
          <div class="row">
            <div class="col"></div>
            <div class="col-12 col-md-8">
              <div class="d-flex justify-content-between mb-3">
                <button
                  v-if="modoEdicion"
                  class="btn btn-sm btn-outline-danger"
                  :disabled="isLoading"
                  @click="eliminarFormula"
                >
                  <div class="d-flex align-items-center gap-2">
                    <i class="bi bi-trash"></i>
                    <span>Eliminar</span>
                  </div>
                </button>
                <div class="d-flex gap-2">
                  <button
                    type="submit"
                    class="btn btn-sm btn-outline-iguapp"
                    form="form-formula"
                    :disabled="!enableSubmitFormula || isLoading"
                  >
                    <spinner v-if="isLoading"></spinner>
                    <div v-else class="d-flex align-items-center gap-2">
                      <i class="bi bi-floppy"></i>
                      <span>Guardar</span>
                    </div>
                  </button>
                </div>
              </div>
              <form id="form-formula" @submit.prevent="onSubmitFormula">
                <div class="mb-3">
                  <label class="form-label">Nombre</label>
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    required
                    minlength="1"
                    v-model="formFormula.nombre"
                  />
                </div>
              </form>
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Nombre</th>
                      <th>Cantidad</th>
                      <th>Fórmula ancho</th>
                      <th>Fórmula alto</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody ref="tbodyMateriales">
                    <tr
                      v-for="(material, index) in formFormula.materiales"
                      :key="index"
                    >
                      <td
                        class="drag-handle align-middle"
                        style="
                          cursor: grab;
                          touch-action: none;
                          user-select: none;
                          min-width: 2.75rem;
                        "
                      >
                        <i class="bi bi-grip-vertical"></i>
                      </td>
                      <td>{{ material.nombre }}</td>
                      <td>{{ material.cantidad }}</td>
                      <td>{{ material.ancho }}</td>
                      <td>{{ material.alto }}</td>
                      <td>
                        <div class="d-flex gap-2">
                          <button
                            class="btn btn-outline-iguapp btn-sm"
                            data-bs-toggle="modal"
                            data-bs-target="#modalMaterial"
                            @click="abrirModalEditarMaterial(index)"
                          >
                            <i class="bi bi-pencil"></i>
                          </button>
                          <button
                            class="btn btn-outline-danger btn-sm"
                            @click="eliminarMaterial(index)"
                          >
                            <i class="bi bi-trash"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
            <div class="col"></div>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-iguapp rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center p-0"
          style="width: 3.5rem; height: 3.5rem"
          data-bs-toggle="modal"
          data-bs-target="#modalMaterial"
        >
          <i class="bi bi-tools fs-4"></i>
        </button>
      </template>

      <modal-material
        ref="modalMaterial"
        :materiales-db="materialesDB"
        @submit-material="onSubmitMaterial"
      ></modal-material>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/formula.js" type="module"></script>
  </body>
</html>
