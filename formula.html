<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- <script src="./js/Vue.js"></script> -->
  </head>
  <body>
    <div id="app" v-cloak class="container">
      <header-back :heading="heading"></header-back>
      <div class="row">
        <div class="col-12 col-md-4 bg-secondary-subtle rounded-3 py-3 mb-3">
          <form-material
            :materiales-db="materialesDB"
            @agregar="agregarMaterial"
          ></form-material>
        </div>
        <div class="col mb-3">
          <form @submit.prevent="guardarFormula">
            <div class="mb-3">
              <label class="form-label">Nombre</label>
              <input
                type="text"
                class="form-control form-control-sm"
                v-model="nuevaFormula.nombre"
              />
            </div>
            <div class="table-responsive">
              <table class="table table-sm">
                <thead>
                  <tr>
                    <th>#id</th>
                    <th>Material</th>
                    <th>Cantidad</th>
                    <template v-if="modoEdicion">
                      <th>Fórmula ancho</th>
                      <th>Fórmula alto</th>
                    </template>
                    <th v-else>Fórmula</th>
                    <th>Acciones</th>
                  </tr>
                </thead>
                <tbody>
                  <tr
                    v-for="(material, index) in materialesFormula"
                    :key="index"
                  >
                    <td>{{ material.id }}</td>
                    <td>{{ material.nombre }}</td>
                    <template v-if="modoEdicion">
                      <td>
                        <input
                          type="number"
                          class="form-control form-control-sm"
                          v-model="nuevaFormula.materiales[index].cantidad"
                        />
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          v-model="nuevaFormula.materiales[index].formulas.ancho"
                        />
                      </td>
                      <td>
                        <input
                          type="text"
                          class="form-control form-control-sm"
                          v-model="nuevaFormula.materiales[index].formulas.alto"
                        />
                      </td>
                    </template>
                    <template v-else>
                      <td>{{ material.cantidad }}</td>
                      <td>{{ material.formula }}</td>
                    </template>
                    <td>
                      <button
                        class="btn btn-sm btn-outline-danger"
                        @click="eliminarMaterial(index)"
                        type="button"
                      >
                        <i class="bi bi-trash3"></i>
                      </button>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div>
              <button
                class="btn btn-outline-secondary btn-sm w-100"
                :disabled="isLoading"
              >
                <span
                  v-if="isLoading"
                  class="spinner-border spinner-border-sm"
                  role="status"
                ></span>
                <span v-else>Guardar <i class="bi bi-floppy"></i></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="./js/formula.js" type="module"></script>
  </body>
</html>
