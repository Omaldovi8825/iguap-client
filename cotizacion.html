<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>Iguapp - Cotización</title>
    <link
      rel="icon"
      href="./assets/images/iguapp-logo-v3.svg"
      type="image/svg+xml"
    />
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <!-- Bootstrap icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <!-- custom CSS -->
    <link rel="stylesheet" href="./css/main.css" />

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  </head>
  <body>
    <div id="app" v-cloak>
      <loader-iguana v-if="initialLoad"></loader-iguana>
      <template v-else>
        <header-back :heading="heading"></header-back>
        <div class="container pt-3 mb-5">
          <div class="row">
            <div class="col-12 col-md-4 mb-3">
              <form class="row">
                <div v-if="!isCotizacionExpress" class="col-12 mb-3">
                  <label class="form-label">Nombre</label>
                  <input
                    type="text"
                    class="form-control form-control-sm"
                    placeholder="Ventana sencilla..."
                    v-model="formCotizacion.nombre"
                  />
                </div>
                <div class="col-12 mb-3">
                  <label class="form-label">Folder fórmula</label>
                  <select
                    class="form-select form-select-sm"
                    v-model="formCotizacion.formula.id_folder"
                  >
                    <option value="0">Sin folder</option>
                    <option
                      v-for="folder in foldersFormulasDB"
                      :value="folder._id"
                      :key="folder._id"
                    >
                      {{ folder.nombre }}
                    </option>
                  </select>
                </div>
                <div class="col-12 mb-3">
                  <label class="form-label">Fórmula</label>
                  <select
                    class="form-select form-select-sm"
                    v-model="formCotizacion.formula.id"
                  >
                    <option
                      v-for="formula in formulasDB"
                      :key="formula._id"
                      :value="formula._id"
                    >
                      {{ formula.nombre }}
                    </option>
                  </select>
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Ancho (cm)</label>
                  <input
                    type="number"
                    step="0.5"
                    min="0.5"
                    class="form-control form-control-sm"
                    v-model="formCotizacion.ancho"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Alto (cm)</label>
                  <input
                    type="number"
                    step="1"
                    min="1"
                    class="form-control form-control-sm"
                    v-model="formCotizacion.alto"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Mano de obra (%)</label>
                  <input
                    type="number"
                    step="0.5"
                    min="0.5"
                    class="form-control form-control-sm"
                    v-model="formCotizacion.manoObra"
                  />
                </div>
                <div class="col-6 mb-3">
                  <label class="form-label">Extras ($)</label>
                  <input
                    type="number"
                    step="0.5"
                    min="0.5"
                    class="form-control form-control-sm"
                    v-model="formCotizacion.extras"
                  />
                </div>
              </form>
            </div>
            <div class="col mb-3">
              <div class="table-responsive">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th colspan="9">Materiales</th>
                    </tr>
                    <tr>
                      <th></th>
                      <th>Nombre</th>
                      <th>Cantidad</th>
                      <th>Fórmula ancho</th>
                      <th>Fórmula alto</th>
                      <th>Ancho</th>
                      <th>Alto</th>
                      <th>Precio</th>
                      <th></th>
                    </tr>
                  </thead>
                  <tbody ref="tbodyMateriales">
                    <tr
                      v-for="(material, index) in cotizacion.materiales"
                      :key="index"
                    >
                      <td class="drag-handle draggable-row align-middle">
                        <i class="bi bi-grip-vertical fs-5"></i>
                      </td>
                      <td>{{ material.nombre }}</td>
                      <td class="text-center">{{ material.cantidad }}</td>
                      <td>{{ material.formulas.ancho }}</td>
                      <td>{{ material.formulas.alto }}</td>
                      <td>{{ material.medidas.ancho }}</td>
                      <td>{{ material.medidas.alto }}</td>
                      <td>{{ formatMoney(material.precio) }}</td>
                      <td>
                        <div class="d-flex justify-content-end gap-2">
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-iguapp"
                            @click="abrirModalEditarMaterial(index)"
                            data-bs-toggle="modal"
                            data-bs-target="#modalMaterial"
                          >
                            <i class="bi bi-pencil"></i>
                          </button>
                          <button
                            type="button"
                            class="btn btn-sm btn-outline-danger"
                            @click="eliminarMaterial(index)"
                          >
                            <i class="bi bi-trash"></i>
                          </button>
                        </div>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div class="table-responsive">
                <table class="table table-sm">
                  <thead>
                    <tr>
                      <th colspan="8" class="text-center">Desglose</th>
                    </tr>
                    <tr>
                      <th>Concepto</th>
                      <th>Costo</th>
                    </tr>
                  </thead>
                  <tbody>
                    <tr>
                      <td>Materiales</td>
                      <td>{{ formatMoney(cotizacion.desglose.materiales) }}</td>
                    </tr>
                    <tr>
                      <td>Mano de obra</td>
                      <td>{{ formatMoney(cotizacion.desglose.manoObra) }}</td>
                    </tr>
                    <tr>
                      <td>Extras</td>
                      <td>{{ formatMoney(cotizacion.desglose.extras) }}</td>
                    </tr>
                    <tr>
                      <td class="fw-bold">Total</td>
                      <td class="fw-bold">
                        {{ formatMoney(cotizacion.desglose.total) }}
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
              <div v-if="!isCotizacionExpress">
                <button
                  class="btn btn-outline-iguapp"
                  :disabled="!enableSave"
                  @click="guardarCotizacion"
                >
                  Guardar
                  <i class="bi bi-save ms-2"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <button
          type="button"
          class="btn btn-iguapp rounded-circle position-fixed bottom-0 end-0 m-4 d-flex align-items-center justify-content-center p-0"
          style="width: 3.5rem; height: 3.5rem"
          data-bs-toggle="modal"
          data-bs-target="#modalMaterial"
        >
          <i class="bi bi-tools fs-4"></i>
        </button>
      </template>

      <modal-material
        ref="modalMaterial"
        :materiales-db="materialesDB"
        @submit-material="onSubmitMaterial"
      ></modal-material>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="./js/cotizacion.js" type="module"></script>
  </body>
</html>
